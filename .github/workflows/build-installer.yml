name: Build Windows Installer

# בונה אוטומטית את ClientManager-Setup.exe על שרת Windows אמיתי בענן
# (חינמי, ללא כרטיס אשראי). רץ אוטומטית בכל העלאת קבצים, וגם ניתן
# להריץ ידנית מטאב Actions באתר GitHub.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build ClientManager.exe
        run: pyinstaller --onefile --windowed --name ClientManager gui.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (Setup.exe)
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload installer as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClientManager-Setup
          path: Output/ClientManager-Setup.exe
